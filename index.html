<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Azure CSPM Posture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f3f6fa; --card:#ffffff; --card-2:#f7f9fc; --ink:#0b1f3a; --ink-2:#4a5a70; --muted:#8492a6;
  --line:#e5eaf1; --line-2:#d5dce6; --ring:rgba(11,31,58,.08);
  --accent:#0e8f7e; --accent-soft:#e3f4f1; --blue:#2a78d6; --blue-soft:#e6f0fc;
  --pass:#0ca30c; --pass-ink:#067a06; --pass-soft:#e5f6e5;
  --crit:#d03b3b; --crit-soft:#fbe9e9; --high:#d03b3b; --med:#ec835a; --low:#fab219; --info:#9aa5b4;
  --na:#b4bdc9; --na-soft:#eef1f5;
  --shadow:0 1px 2px rgba(11,31,58,.04),0 4px 16px rgba(11,31,58,.05);
  --r:14px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1117; --card:#161b22; --card-2:#1c222b; --ink:#e6edf3; --ink-2:#b1bac4; --muted:#7d8590;
  --line:#262c36; --line-2:#323a46; --ring:rgba(255,255,255,.08);
  --accent:#2bb39f; --accent-soft:#12302c; --blue:#3987e5; --blue-soft:#15263b;
  --pass-ink:#3fc23f; --pass-soft:#132a15; --crit-soft:#3a1717; --na:#4b5563; --na-soft:#21262d;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Inter","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--blue));display:grid;place-items:center;color:#fff}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--card-2);color:var(--ink)}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--crit);color:#fff;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--muted);padding:0 6px}
.main{min-width:0;padding:20px 28px 48px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;margin:0;letter-spacing:-.02em;font-weight:700}
.top .sub{color:var(--muted);font-size:13px}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.icon{width:36px;padding:0;justify-content:center}
.sel{height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);padding:0 10px;max-width:280px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card h3{margin:0 0 2px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.card .hint{font-size:12px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;gap:16px}
.row1{grid-template-columns:minmax(300px,1.1fr) 2fr;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{padding:16px 18px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
.kpi:hover{border-color:var(--line-2);transform:translateY(-1px)}
.kpi .v{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:6px}
.kpi .v small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi .d{font-size:12px;color:var(--ink-2);margin:2px 0 10px}
.meter{height:5px;border-radius:99px;background:var(--line);overflow:hidden;display:flex;gap:2px}
.meter i{display:block;height:100%;border-radius:99px}
.hero{display:flex;align-items:center;gap:22px;background:linear-gradient(135deg,var(--card) 40%,var(--accent-soft))}
.gauge{position:relative;width:150px;height:150px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .c b{font-size:32px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1}
.gauge .c span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.hero h2{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero p{margin:0 0 4px;color:var(--ink-2);font-size:13px}
.hero .split{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}

.row2{grid-template-columns:1.4fr 1fr;margin-bottom:16px}
.row3{grid-template-columns:repeat(3,1fr);margin-bottom:16px}

/* bar lists */
.blist{display:flex;flex-direction:column;gap:4px}
.brow{display:grid;grid-template-columns:minmax(110px,170px) 1fr 64px;align-items:center;gap:12px;padding:6px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:calc(100% + 16px)}
.brow:hover{background:var(--card-2)}
.brow .lb{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .lb small{color:var(--muted);font-weight:400;margin-left:4px}
.brow .vl{text-align:right;font-weight:700;font-size:13px}
.brow .vl small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.track{height:12px;display:flex;gap:2px;border-radius:4px;overflow:hidden;background:var(--line)}
.track i{display:block;height:100%}
.track i:first-child{border-radius:4px 0 0 4px}.track i:last-child{border-radius:0 4px 4px 0}.track i:only-child{border-radius:4px}
.solo{height:12px;border-radius:0 4px 4px 0;background:var(--blue);min-width:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:-4px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* severity tiles */
.sev{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sevt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--card);text-align:left;position:relative;overflow:hidden}
.sevt:hover{border-color:var(--line-2)}
.sevt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.sevt .k{font-size:12px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.sevt .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.sevt .m{font-size:12px;color:var(--muted)}

/* matrix */
.mx{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:12px}
.mx .h{color:var(--muted);font-weight:600;text-align:center;padding:4px 0}
.mx .rh{color:var(--ink-2);font-weight:600;display:flex;align-items:center;padding-right:6px}
.mx button{height:56px;border-radius:8px;border:0;cursor:pointer;font-weight:800;font-size:18px;color:var(--ink)}
.mx button small{display:block;font-size:10px;font-weight:500;opacity:.75}
.mx button:hover{outline:2px solid var(--ink-2)}

/* table */
.tbl-wrap{overflow:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;z-index:1;background:var(--card-2);text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
th.s{cursor:pointer}th.s:hover{color:var(--ink)}
th .ar{opacity:.4;margin-left:4px}th.on .ar{opacity:1;color:var(--blue)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--card-2)}
tbody tr.picked td{background:color-mix(in srgb,var(--accent-soft) 50%,var(--card))}
tbody tr.on td{background:var(--blue-soft)}
th.chk,td.chk{width:38px;text-align:center;padding-left:12px;padding-right:4px}
th.chk input,td.chk input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;vertical-align:middle;margin:0}
.btn.picked-on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
td.id{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted);white-space:nowrap}
td.ds{min-width:280px;max-width:460px}
td.ds b{font-weight:500;display:block}
td.ds small{color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.tag.FAIL{background:var(--crit-soft);color:var(--crit)}
.tag.PASS{background:var(--pass-soft);color:var(--pass-ink)}
.tag.NA{background:var(--na-soft);color:var(--ink-2)}
.minibar{display:flex;gap:2px;height:8px;width:110px;border-radius:3px;overflow:hidden;background:var(--line)}
.minibar i{display:block;height:100%}
.al{display:flex;align-items:center;gap:8px;white-space:nowrap}
.al b{min-width:28px;text-align:right}
.pct{display:flex;align-items:center;gap:8px;white-space:nowrap}
.pct .bar{width:70px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pct .bar i{display:block;height:100%;border-radius:99px}
.muted{color:var(--muted)}

/* filters */
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.search{position:relative;flex:1 1 240px;max-width:360px}
.search input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);padding:0 12px 0 34px}
.search svg{position:absolute;left:11px;top:10px;color:var(--muted)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;height:28px;padding:0 10px;border-radius:7px;cursor:pointer;font-weight:500;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--card)}
.seg button small{opacity:.65;margin-left:3px}
.dd{position:relative}
.dd>.btn.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.pop{position:absolute;top:42px;left:0;z-index:20;width:280px;max-height:360px;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 32px rgba(11,31,58,.16)}
.pop input{margin:8px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:var(--card-2);padding:0 10px}
.pop .opts{overflow:auto;padding:0 6px 6px}
.pop label{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.pop label:hover{background:var(--card-2)}
.pop label span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop label em{font-style:normal;color:var(--muted);font-size:12px}
.pop label.zero{opacity:.45}
.pop .pf{display:flex;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line)}
.pop .pf button{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:99px;background:var(--blue-soft);color:var(--blue);font-size:12px;font-weight:600;border:0;cursor:pointer}
.chip svg{width:14px;height:14px}
.chip.clear{background:none;color:var(--ink-2);text-decoration:underline}
.count{font-size:13px;color:var(--ink-2);margin-left:auto}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(11,31,58,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--card);z-index:41;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(11,31,58,.15)}
.drawer.on{transform:none}
.dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{font-size:17px;margin:4px 0 0;letter-spacing:-.01em;line-height:1.35}
.dh .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.db{padding:18px 22px 40px;overflow:auto}
.db section{margin-bottom:22px}
.db h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.db p{margin:0 0 8px;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fact{background:var(--card-2);border-radius:10px;padding:10px 12px}
.fact span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.fact b{font-size:18px;font-weight:800}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
.steps{margin:0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.steps li{padding:5px 0}
.steps code,.db code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--card-2);border:1px solid var(--line);padding:1px 5px;border-radius:5px;word-break:break-all;color:var(--ink)}
.ph{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--blue);background:var(--blue-soft);padding:0 4px;border-radius:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:11px;background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink-2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px}
.tabs button{border:0;background:none;padding:8px 10px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}

.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:7px 10px;border-radius:8px;max-width:260px;opacity:0;transition:opacity .1s;line-height:1.45}
.tip.on{opacity:1}
.empty{display:grid;place-items:center;text-align:center;padding:80px 20px;color:var(--ink-2)}
.empty .card{max-width:440px;padding:32px}
.drop{position:fixed;inset:0;z-index:70;background:rgba(14,143,126,.15);border:3px dashed var(--accent);display:none;place-items:center;font-size:20px;font-weight:700;color:var(--accent)}
.drop.on{display:grid}
.topfix td{padding:9px 12px}
.trend svg{width:100%;height:120px;display:block}
.hide{display:none!important}

@media (max-width:1180px){.row1{grid-template-columns:1fr}.row3{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand{padding:0 8px 0 0}.brand div:last-child{display:none}
  .nav{width:auto;white-space:nowrap}
  .side-foot{display:none}
  .main{padding:16px}
  .row2,.row3{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .hero{flex-direction:column;text-align:center}.hero .split{justify-content:center}
  .facts{grid-template-columns:repeat(2,1fr)}
  .brow{grid-template-columns:110px 1fr 54px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</svg>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><svg class="i"><use href="#i-shield"/></svg></div>
      <div><b>CSPM Posture</b><span>Azure · GISG Policy</span></div>
    </div>
    <button class="nav" data-view="overview"><svg class="i"><use href="#i-grid"/></svg>ภาพรวม</button>
    <button class="nav" data-view="controls"><svg class="i"><use href="#i-list"/></svg>Controls <span class="badge" id="navFail"></span></button>
    <button class="nav" id="navPicked"><svg class="i"><use href="#i-bookmark"/></svg>ข้อที่เลือกไว้ <span class="badge hide" id="navPickCount" style="background:var(--accent)"></span></button>
    <div class="side-foot">
      <span id="srcInfo"></span>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <h1 id="title">ภาพรวม</h1>
        <div class="sub" id="subtitle"></div>
      </div>
      <div class="sp"></div>
      <select class="sel" id="fileSel" aria-label="รอบสแกน"></select>
      <button class="btn" id="shareBtn" title="คัดลอกลิงก์แชร์หน้าปัจจุบัน (รวมข้อที่เลือกไว้)"><svg class="i"><use href="#i-share"/></svg><span id="shareTxt">แชร์ลิงก์</span></button>
      <label class="btn" title="โหลดไฟล์ CSV จาก Orca">
        <svg class="i"><use href="#i-upload"/></svg>โหลด CSV
        <input type="file" id="fileIn" accept=".csv" hidden>
      </label>
      <button class="btn icon" id="themeBtn" aria-label="สลับธีม"><svg class="i"><use href="#i-moon"/></svg></button>
    </div>

    <div id="vOverview"></div>
    <div id="vControls" class="hide"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="tip" id="tip"></div>
<div class="drop" id="drop">วางไฟล์ CSV ที่นี่</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US');
const pct = (a, b, d = 1) => b ? (a / b * 100).toFixed(d) : '0';
const ico = (id, cls = 'i') => `<svg class="${cls}"><use href="#i-${id}"/></svg>`;

const SEV = [
  {k:'c', key:'Critical', label:'Critical', c:'#8f1d1d'},
  {k:'h', key:'High', label:'High', c:'var(--high)'},
  {k:'m', key:'Medium', label:'Medium', c:'var(--med)'},
  {k:'l', key:'Low', label:'Low', c:'var(--low)'},
  {k:'i', key:'Info', label:'Info', c:'var(--info)'},
];
const STATUS = {FAIL:{label:'FAIL', icon:'x', c:'var(--crit)'}, PASS:{label:'PASS', icon:'check', c:'var(--pass)'}, NA:{label:'ไม่มี asset', icon:'minus', c:'var(--na)'}};
const IMPACT_TH = {
  information_disclosure:'ข้อมูลรั่วไหล', insufficient_monitoring:'มอนิเตอร์ไม่พอ', exposure:'เปิดสู่ภายนอก',
  account_takeover:'ยึดบัญชี', one_asset_access:'เข้าถึง asset', compromise:'ถูกเจาะระบบ', none:'ไม่ระบุ'
};
const impactLabel = v => IMPACT_TH[v] || (v ? v.replace(/_/g, ' ') : '—');

/* ---------- parsing ---------- */
function parseCSV(t) {
  t = t.replace(/^﻿/, '');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) {
      if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n') { row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  const head = rows.shift();
  return rows.filter(r => r.length > 1).map(r => Object.fromEntries(head.map((h, i) => [h.trim(), r[i] ?? ''])));
}
// Orca exports list columns as Python list literals: "['a', \"b's\"]"
function pyList(s) {
  s = (s || '').trim();
  if (!s) return [];
  if (s[0] !== '[') return [s];
  const out = []; let i = 1;
  while (i < s.length) {
    const q = s[i];
    if (q === "'" || q === '"') {
      let j = i + 1, b = '';
      while (j < s.length && s[j] !== q) { if (s[j] === '\\' && j + 1 < s.length) { b += s[j + 1]; j += 2; continue; } b += s[j++]; }
      out.push(b); i = j + 1;
    } else i++;
  }
  return out;
}
const int = v => parseInt(v, 10) || 0;
function normalize(r) {
  const total = int(r['Total Assets']), failed = int(r['Failed Assets']);
  const result = (r['Result'] || '').toUpperCase();
  const status = result === 'FAIL' ? 'FAIL' : (total === 0 ? 'NA' : 'PASS');
  const al = {c:int(r['Critical Alerts']), h:int(r['High Alerts']), m:int(r['Medium Alerts']), l:int(r['Low Alerts']), i:int(r['Informational Alerts'])};
  const score = int(r['Asset Compliance Score']);
  return {
    id: r['Control Id'], cat: r['Category'] || '—', sub: r['Subcategory'] || '—', desc: (r['Description'] || '').replace(/^GISS-/, ''),
    rawDesc: r['Description'], result, status, al, open: int(r['Open Alerts']), total, failed,
    score: score < 0 ? null : score, rec: r['Recommendation'], acat: r['Alert Category'] || '', details: r['Details'],
    orca: r['Score'], impact: r['Impact'] || '', access: r['Access'] || '', cx: r['Complexity'] || '',
    cli: pyList(r['Remediation Cli']), console: pyList(r['Remediation Console']), tags: pyList(r['Tags']),
    labels: pyList(r['Labels']), mitre: r['Mitre Category'] || '', tech: pyList(r['Mitre Technique']),
    vendors: pyList(r['Vendors']), priority: r['Priority'], notes: r['User Notes'],
  };
}
function summarize(rows) {
  const s = {n: rows.length, FAIL: 0, PASS: 0, NA: 0, total: 0, failed: 0, al: {c:0,h:0,m:0,l:0,i:0}, alCtl: {c:0,h:0,m:0,l:0,i:0}};
  for (const r of rows) {
    s[r.status]++; s.total += r.total; s.failed += r.failed;
    for (const k in r.al) { s.al[k] += r.al[k]; if (r.al[k]) s.alCtl[k]++; }
  }
  s.evald = s.PASS + s.FAIL;
  s.rate = s.evald ? s.PASS / s.evald * 100 : 0;
  s.rateAll = s.n ? (s.PASS + s.NA) / s.n * 100 : 0;
  s.assetRate = s.total ? (s.total - s.failed) / s.total * 100 : 0;
  s.open = Object.values(s.al).reduce((a, b) => a + b, 0);
  return s;
}

/* ---------- state ---------- */
const FACETS = [
  {k:'cat', label:'หมวด', get: r => [r.cat]},
  {k:'sub', label:'บริการ', get: r => [r.sub]},
  {k:'acat', label:'ประเภทปัญหา', get: r => r.acat ? [r.acat] : []},
  {k:'sev', label:'ระดับ Alert', get: r => SEV.filter(x => r.al[x.k] > 0).map(x => x.key), order: SEV.map(x => x.key)},
  {k:'mitre', label:'MITRE', get: r => r.mitre ? [r.mitre] : []},
  {k:'tech', label:'Technique', get: r => r.tech},
  {k:'access', label:'ช่องทาง', get: r => r.access ? [r.access] : []},
  {k:'cx', label:'ความยากโจมตี', get: r => r.cx ? [r.cx] : [], order:['low','medium','high']},
  {k:'impact', label:'ผลกระทบ', get: r => r.impact ? [r.impact] : [], fmt: impactLabel},
];
const S = {
  files: [], cur: null, rows: [], view: 'overview',
  f: {q: '', st: 'all', picked: false, ...Object.fromEntries(FACETS.map(x => [x.k, new Set()]))},
  picked: new Set(),
  sort: {k: 'risk', d: -1}, open: null, sel: null, tab: 'cli', shareKey: '',
};
try {
  const saved = JSON.parse(localStorage.getItem('cspm-picked') || '[]');
  if (Array.isArray(saved)) S.picked = new Set(saved);
} catch (e) {}
function savePicked() {
  try { localStorage.setItem('cspm-picked', JSON.stringify([...S.picked])); } catch (e) {}
  updatePickBadge();
}
function updatePickBadge() {
  const n = S.picked.size;
  const b = $('#navPickCount');
  if (b) { b.textContent = n || ''; b.classList.toggle('hide', !n); }
  const nav = $('#navPicked');
  if (nav) nav.classList.toggle('on', S.view === 'controls' && S.f.picked);
}
function togglePick(id, force) {
  const has = S.picked.has(id);
  const next = force !== undefined ? force : !has;
  if (next) S.picked.add(id); else S.picked.delete(id);
  if (!S.picked.size && S.f.picked) S.f.picked = false;
  savePicked();
}

function match(r, skip) {
  const f = S.f;
  if (skip !== 'picked' && f.picked && !S.picked.has(r.id)) return false;
  if (skip !== 'st' && f.st !== 'all' && r.status !== f.st) return false;
  if (f.q) {
    const q = f.q.toLowerCase();
    const hay = (r.id + ' ' + r.desc + ' ' + r.cat + ' ' + r.sub + ' ' + r.acat + ' ' + r.details + ' ' + r.rec + ' ' + r.tags.join(' ') + ' ' + r.tech.join(' ')).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  for (const fc of FACETS) {
    if (fc.k === skip) continue;
    const set = f[fc.k];
    if (set.size && !fc.get(r).some(v => set.has(v))) return false;
  }
  return true;
}
const filtered = () => S.rows.filter(r => match(r));

/* ---------- url hash ---------- */
function writeHash() {
  const p = new URLSearchParams();
  if (S.view === 'controls') {
    if (S.f.q) p.set('q', S.f.q);
    if (S.f.st !== 'all') p.set('st', S.f.st);
    if (S.f.picked) p.set('only', '1');
    for (const fc of FACETS) if (S.f[fc.k].size) p.set(fc.k, [...S.f[fc.k]].join('|'));
    if (S.sel) p.set('id', S.sel);
  }
  if (S.picked.size) p.set('picked', [...S.picked].join('|'));
  const h = '#' + S.view + (p.toString() ? '?' + p : '');
  if (location.hash !== h) history.replaceState(null, '', location.pathname + location.search + h);
}
function readHash() {
  const [v, qs] = location.hash.slice(1).split('?');
  S.view = v === 'controls' ? 'controls' : 'overview';
  const p = new URLSearchParams(qs || '');
  S.f.q = p.get('q') || ''; S.f.st = p.get('st') || 'all';
  S.f.picked = p.get('only') === '1';
  if (p.has('picked')) {
    S.picked = new Set(p.get('picked') ? p.get('picked').split('|') : []);
    savePicked();
  }
  for (const fc of FACETS) S.f[fc.k] = new Set(p.get(fc.k) ? p.get(fc.k).split('|') : []);
  S.sel = p.get('id');
}
function go(view, filters = {}) {
  S.view = view;
  if (view === 'controls') {
    S.f.q = ''; S.f.st = filters.st || 'all';
    S.f.picked = !!filters.picked;
    for (const fc of FACETS) S.f[fc.k] = new Set(filters[fc.k] || []);
    S.sel = null;
  }
  render(); writeHash(); window.scrollTo({top: 0});
}

/* ---------- data loading & encryption ---------- */
const dateOf = name => (name.match(/(\d{4}-\d{2}-\d{2})/) || [])[1] || '';
function b64urlToBytes(s) {
  const b64 = s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4);
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function tryDecryptBundle(buf, keyStr) {
  const keyBytes = b64urlToBytes(keyStr.trim());
  if (keyBytes.length !== 32) throw new Error('bad key');
  const iv = buf.slice(0, 12), data = buf.slice(12);
  const ck = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv}, ck, data);
  return JSON.parse(new TextDecoder().decode(plain));
}
async function boot() {
  const urlParams = new URLSearchParams(location.search);
  const urlKey = urlParams.get('k') || '';
  if (urlKey) {
    S.shareKey = urlKey;
    try { localStorage.setItem('cspm-key', urlKey); } catch (e) {}
  } else {
    try { S.shareKey = localStorage.getItem('cspm-key') || ''; } catch (e) {}
  }

  // 1. Try encrypted bundle first (used on public static hosting so raw CSVs are never exposed)
  try {
    const encRes = await fetch('data/bundle.enc', {cache: 'no-store'});
    if (encRes.ok && (encRes.headers.get('content-type') || '').indexOf('text/html') === -1) {
      const buf = new Uint8Array(await encRes.arrayBuffer());
      if (buf.length > 28) {
        if (!S.shareKey) { renderLocked(false); return; }
        try {
          const items = await tryDecryptBundle(buf, S.shareKey);
          items.sort((a, b) => (dateOf(b.name) || b.mtime || '').localeCompare(dateOf(a.name) || a.mtime || ''));
          for (const f of items) {
            const rows = parseCSV(f.csv).map(normalize);
            S.files.push({name: f.name, date: dateOf(f.name) || (f.mtime || '').slice(0, 16), rows});
          }
          if (S.files.length) { pick(0); return; }
        } catch (e) {
          renderLocked(true); return;
        }
      }
    }
  } catch (e) {}

  // 2. Local / Docker plaintext CSV mode
  let list = [];
  for (const url of ['data/', 'data/index.json']) {
    try {
      const res = await fetch(url, {headers: {Accept: 'application/json'}});
      if (res.ok) {
        const j = await res.json();
        list = j.filter(x => (!x.type || x.type === 'file') && /\.csv$/i.test(x.name)).map(x => ({name: x.name, mtime: x.mtime}));
        if (list.length) break;
      }
    } catch (e) {}
  }
  if (!list.length) list = [{name: 'Compliance_Framework_GISG_CSPM_Policy_2026-10-27.csv'}];
  list.sort((a, b) => (dateOf(b.name) || b.mtime || '').localeCompare(dateOf(a.name) || a.mtime || ''));
  for (const f of list) {
    try {
      const res = await fetch('data/' + encodeURIComponent(f.name));
      if (!res.ok) continue;
      const rows = parseCSV(await res.text()).map(normalize);
      S.files.push({name: f.name, date: dateOf(f.name) || (f.mtime || '').slice(0, 16), rows});
    } catch (e) {}
  }
  if (S.files.length) pick(0); else renderEmpty();
}
function renderLocked(bad) {
  $('#vOverview').classList.remove('hide');
  $('#vControls').classList.add('hide');
  $('#vOverview').innerHTML = `<div class="empty"><div class="card">
    <div style="width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:0 auto 12px">${ico('lock')}</div>
    <h3>ข้อมูลถูกเข้ารหัส (เข้าได้เฉพาะคนที่มีลิงก์)</h3>
    <p class="hint" style="margin:6px 0 16px">${bad ? 'รหัสกุญแจในลิงก์ไม่ถูกต้อง กรุณาตรวจสอบลิงก์อีกครั้ง' : 'กรุณาเปิดเข้าใช้งานผ่านลิงก์เต็มที่มีรหัสกุญแจ (?k=...) หรือวางรหัสกุญแจด้านล่าง'}</p>
    <form id="unlockForm" style="display:flex;gap:8px;justify-content:center">
      <input id="keyIn" placeholder="วางรหัสกุญแจ หรือลิงก์ที่มี ?k=..." style="height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--card-2);padding:0 12px;flex:1">
      <button type="submit" class="btn primary">ปลดล็อก</button>
    </form>
  </div></div>`;
  const form = $('#unlockForm');
  if (form) form.onsubmit = e => {
    e.preventDefault();
    let v = ($('#keyIn').value || '').trim();
    const m = v.match(/[?&]k=([A-Za-z0-9_-]+)/);
    if (m) v = m[1];
    if (!v) return;
    const u = new URL(location.href);
    u.searchParams.set('k', v);
    location.href = u.toString();
  };
}
function pick(i) { S.cur = i; S.rows = S.files[i].rows; render(); }
function addFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    const rows = parseCSV(rd.result).map(normalize).filter(r => r.id);
    if (!rows.length) { alert('ไม่พบข้อมูล control ในไฟล์นี้'); return; }
    S.files.unshift({name: file.name, date: dateOf(file.name) || 'อัปโหลด', rows, local: true});
    pick(0);
  };
  rd.readAsText(file);
}

/* ---------- render: shell ---------- */
function render() {
  const s = summarize(S.rows), file = S.files[S.cur];
  document.querySelectorAll('.nav[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === S.view && !(b.dataset.view === 'controls' && S.f.picked)));
  updatePickBadge();
  $('#navFail').textContent = s.FAIL || '';
  $('#title').textContent = S.view === 'overview' ? 'ภาพรวม' : (S.f.picked ? 'Controls · ข้อที่เลือกไว้' : 'Controls');
  $('#subtitle').textContent = `${file.date || ''} · ${s.n} controls · ${[...new Set(S.rows.flatMap(r => r.vendors))].join(', ') || 'azure'}`;
  $('#srcInfo').textContent = file.name;
  $('#fileSel').innerHTML = S.files.map((f, i) => `<option value="${i}" ${i === S.cur ? 'selected' : ''}>${esc(f.date || f.name)}${f.local ? ' (อัปโหลด)' : ''}</option>`).join('');
  $('#fileSel').classList.toggle('hide', S.files.length < 2);
  $('#vOverview').classList.toggle('hide', S.view !== 'overview');
  $('#vControls').classList.toggle('hide', S.view !== 'controls');
  if (S.view === 'overview') renderOverview(s); else renderControls();
  renderDrawer();
}
function renderEmpty() {
  $('#vOverview').innerHTML = `<div class="empty"><div class="card"><h3>ยังไม่มีข้อมูล</h3><p class="hint">วางไฟล์ CSV ที่ export จาก Orca ไว้ในโฟลเดอร์ <code>data/</code> หรือกด “โหลด CSV”</p></div></div>`;
}

/* ---------- render: overview ---------- */
function gauge(v) {
  const r = 62, c = 2 * Math.PI * r, col = v >= 80 ? 'var(--pass)' : v >= 60 ? 'var(--med)' : 'var(--crit)';
  return `<div class="gauge"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/>
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c * v / 100} ${c}"/></svg>
    <div class="c"><div><b class="num">${v.toFixed(1)}%</b><span>PASS RATE</span></div></div></div>`;
}
function kpi({t, v, unit = '', d, meter, go: g, tip}) {
  return `<div class="card kpi" role="button" tabindex="0" data-go='${esc(JSON.stringify(g || {}))}' ${tip ? `data-tip="${esc(tip)}"` : ''}>
    <h3>${t}</h3><div class="v num">${v}${unit ? ` <small>${unit}</small>` : ''}</div><div class="d">${d}</div>
    <div class="meter">${meter.map(([w, c]) => `<i style="width:${w}%;background:${c}"></i>`).join('')}</div></div>`;
}
function groupBy(rows, fn) {
  const m = new Map();
  for (const r of rows) for (const k of [].concat(fn(r))) { if (!k) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  return m;
}
function riskCmp(a, b) {
  for (const k of ['c', 'h', 'm']) if (b.al[k] !== a.al[k]) return b.al[k] - a.al[k];
  if (b.failed !== a.failed) return b.failed - a.failed;
  return b.al.l - a.al.l;
}

function renderOverview(s) {
  const rows = S.rows, fails = rows.filter(r => r.status === 'FAIL');
  const highCtl = fails.filter(r => r.al.h + r.al.c > 0).length;
  const remoteEasy = fails.filter(r => r.access === 'remote' && r.cx === 'low').length;

  // category stacks, worst pass rate first
  const cats = [...groupBy(rows, r => r.cat)].map(([k, rs]) => {
    const t = summarize(rs); return {k, t};
  }).sort((a, b) => a.t.rate - b.t.rate || b.t.FAIL - a.t.FAIL);

  const acat = [...groupBy(fails, r => r.acat)].map(([k, rs]) => ({k, n: rs.length, a: rs.reduce((x, r) => x + r.failed, 0)})).sort((a, b) => b.n - a.n);
  const mitre = [...groupBy(fails, r => r.mitre)].map(([k, rs]) => ({k, n: rs.length})).sort((a, b) => b.n - a.n);
  const subs = [...groupBy(fails, r => r.sub)].map(([k, rs]) => ({k, n: rs.length, cat: rs[0].cat, a: rs.reduce((x, r) => x + r.failed, 0)})).sort((a, b) => b.n - a.n || b.a - a.a).slice(0, 8);
  const maxA = Math.max(1, ...acat.map(x => x.n)), maxM = Math.max(1, ...mitre.map(x => x.n)), maxS = Math.max(1, ...subs.map(x => x.n));

  const top = [...fails].sort(riskCmp).slice(0, 10);
  const mx = {};
  for (const r of fails) { const k = r.access + '|' + r.cx; mx[k] = (mx[k] || 0) + 1; }
  const mxMax = Math.max(1, ...Object.values(mx));

  const trend = S.files.length > 1 ? S.files.map(f => ({d: f.date, v: summarize(f.rows).rate})).reverse() : null;

  $('#vOverview').innerHTML = `
  <div class="grid row1">
    <div class="card hero">
      ${gauge(s.rate)}
      <div>
        <h2>Controls ที่ผ่าน</h2>

function trendSvg(t) {
  const W = 800, H = 120, p = 24, xs = i => p + i * (W - 2 * p) / Math.max(1, t.length - 1), ys = v => H - p - v / 100 * (H - 2 * p);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${[0, 50, 100].map(v => `<line x1="${p}" x2="${W - p}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)"/>`).join('')}
    <polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${t.map((d, i) => xs(i) + ',' + ys(d.v)).join(' ')}"/>
    ${t.map((d, i) => `<circle cx="${xs(i)}" cy="${ys(d.v)}" r="5" fill="var(--accent)" stroke="var(--card)" stroke-width="2" data-tip="${esc(d.d)}: ${d.v.toFixed(1)}%"/>`).join('')}
  </svg>`;
}
function alertCell(r) {
  const tot = SEV.reduce((a, x) => a + r.al[x.k], 0);
  if (!tot) return '<span class="muted">—</span>';
  const tip = SEV.filter(x => r.al[x.k]).map(x => `${x.label} ${fmt(r.al[x.k])}`).join(' · ');
  return `<div class="al" data-tip="${esc(tip)}"><b class="num">${fmt(tot)}</b><span class="minibar">${SEV.filter(x => r.al[x.k]).map(x => `<i style="width:${r.al[x.k] / tot * 100}%;background:${x.c}"></i>`).join('')}</span>${r.al.h + r.al.c ? `<span class="tag FAIL">${r.al.h + r.al.c} High</span>` : ''}</div>`;
}

/* ---------- render: controls ---------- */
const COLS = [
  {k:'id', label:'ID', sort:(a, b) => a.id.localeCompare(b.id, undefined, {numeric: true})},
  {k:'desc', label:'Control', sort:(a, b) => a.desc.localeCompare(b.desc)},
  {k:'status', label:'ผล', sort:(a, b) => ({FAIL:0, PASS:1, NA:2}[a.status] - {FAIL:0, PASS:1, NA:2}[b.status])},
  {k:'risk', label:'Alerts', sort:(a, b) => riskCmp(b, a)},
  {k:'failed', label:'Assets', sort:(a, b) => a.failed - b.failed || a.total - b.total},
  {k:'score', label:'Compliance', sort:(a, b) => (a.score ?? 101) - (b.score ?? 101)},
  {k:'mitre', label:'MITRE', sort:(a, b) => a.mitre.localeCompare(b.mitre)},
];
function renderControls() {

  const active = FACETS.filter(fc => S.f[fc.k].size);
  const allVisiblePicked = rows.length > 0 && rows.every(r => S.picked.has(r.id));
  const someVisiblePicked = rows.some(r => S.picked.has(r.id));

  el.innerHTML = `
    <div class="fbar">
      <div class="search">${ico('search')}<input id="q" type="search" placeholder="ค้นหา ID, ชื่อ, tag, technique…" value="${esc(S.f.q)}" aria-label="ค้นหา"></div>
      <div class="seg" role="tablist">${[['all', 'ทั้งหมด'], ['FAIL', 'FAIL'], ['PASS', 'PASS'], ['NA', 'ไม่มี asset']].map(([k, l]) =>

      <button class="btn ${S.f.picked ? 'picked-on' : ''}" id="btnPicked" title="กรองเฉพาะข้อที่ติ๊กเลือกไว้">${ico('bookmark')}ที่เลือกไว้ <span class="num">(${S.picked.size})</span></button>
      ${FACETS.map(fc => `<div class="dd" data-dd="${fc.k}"><button class="btn ${S.f[fc.k].size ? 'on' : ''}" data-ddbtn="${fc.k}">${fc.label}${S.f[fc.k].size ? ` · ${S.f[fc.k].size}` : ''} ${ico('down')}</button></div>`).join('')}
      <button class="btn" id="exportBtn" title="ส่งออกรายการที่กรองแล้ว">${ico('dl')}Export</button>
    </div>
    <div class="chips">
      ${S.f.picked ? `<button class="chip" id="rmPickedFilter" style="background:var(--accent-soft);color:var(--accent)">เฉพาะข้อที่เลือกไว้ (${S.picked.size}) ${ico('x')}</button>` : ''}
      ${active.flatMap(fc => [...S.f[fc.k]].map(v => `<button class="chip" data-rm="${fc.k}" data-v="${esc(v)}">${fc.label}: ${esc(fc.fmt ? fc.fmt(v) : v)} ${ico('x')}</button>`)).join('')}
      ${active.length || S.f.q || S.f.st !== 'all' || S.f.picked ? `<button class="chip clear" id="clearAll">ล้างตัวกรอง</button>` : ''}
      ${S.picked.size ? `<button class="chip clear" id="clearPicked" style="color:var(--crit)">ล้างที่เลือก (${S.picked.size})</button>` : ''}
      <span class="count"><b class="num">${rows.length}</b> จาก ${S.rows.length} controls${S.picked.size ? ` · เลือกไว้ <b class="num">${S.picked.size}</b> ข้อ` : ''}</span>

    </table></div>`;
  const pa = $('#pickAll');
  if (pa && !allVisiblePicked && someVisiblePicked) pa.indeterminate = true;
  if (keepFocus) { const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  if (S.open) openPop(S.open, true);
}
const statusTag = st => `<span class="tag ${st}">${ico(STATUS[st].icon)}${STATUS[st].label}</span>`;

function openPop(k, keep) {
  closePop(keep);
  const fc = FACETS.find(x => x.k === k), host = document.querySelector(`[data-dd="${k}"]`);
  if (!host) return;
  S.open = k;
  const counts = new Map();
  for (const r of S.rows) if (match(r, k)) for (const v of fc.get(r)) counts.set(v, (counts.get(v) || 0) + 1);
  const all = [...new Set(S.rows.flatMap(fc.get))];
  if (fc.order) all.sort((a, b) => fc.order.indexOf(a) - fc.order.indexOf(b)); else all.sort((a, b) => (counts.get(b) || 0) - (counts.get(a) || 0) || a.localeCompare(b));
  const pop = document.createElement('div');
  pop.className = 'pop';
  pop.innerHTML = `${all.length > 8 ? `<input placeholder="ค้นหา${fc.label}…" data-ps>` : ''}
    <div class="opts">${all.map(v => `<label class="${counts.get(v) ? '' : 'zero'}" data-txt="${esc((fc.fmt ? fc.fmt(v) : v).toLowerCase())}">
      <input type="checkbox" value="${esc(v)}" ${S.f[k].has(v) ? 'checked' : ''}><span style="${k === 'mitre' || k === 'cx' || k === 'access' ? 'text-transform:capitalize' : ''}">${esc(fc.fmt ? fc.fmt(v) : v)}</span><em class="num">${counts.get(v) || 0}</em></label>`).join('')}</div>
    <div class="pf"><button data-pclear>ล้าง</button><button data-pclose>เสร็จ</button></div>`;
  host.appendChild(pop);
  const r = pop.getBoundingClientRect();
  if (r.right > innerWidth - 8) pop.style.left = Math.min(0, innerWidth - 8 - r.right) + 'px';
  pop.addEventListener('change', e => {
    const v = e.target.value; e.target.checked ? S.f[k].add(v) : S.f[k].delete(v);
    renderControls(); writeHash();
  });
  pop.addEventListener('input', e => {
    if (!e.target.matches('[data-ps]')) return;
    const q = e.target.value.toLowerCase();
    pop.querySelectorAll('label').forEach(l => l.classList.toggle('hide', !l.dataset.txt.includes(q)));
  });
  pop.querySelector('[data-pclear]').onclick = () => { S.f[k].clear(); renderControls(); writeHash(); };
  pop.querySelector('[data-pclose]').onclick = () => closePop();
}
function closePop(keep) {
  document.querySelectorAll('.pop').forEach(p => p.remove());
  if (!keep) S.open = null;
}

  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return s;
}

      </section>
      ${r.details ? `<section><h4>ความเสี่ยง</h4><p>${ph(r.details)}</p></section>` : ''}
      ${r.rec ? `<section><h4>วิธีแก้</h4><p>${ph(r.rec)}</p></section>` : ''}
      ${r.cli.length || r.console.length ? `<section><h4>ขั้นตอน</h4>
        <div class="tabs">${r.cli.length ? `<button class="${S.tab === 'cli' ? 'on' : ''}" data-tab="cli">Azure CLI</button>` : ''}${r.console.length ? `<button class="${S.tab === 'console' ? 'on' : ''}" data-tab="console">Portal</button>` : ''}</div>
        <ul class="steps">${steps.map(x => `<li>${md(x)}</li>`).join('')}</ul></section>` : ''}
      <section><h4>ข้อมูลอ้างอิง</h4><dl class="kv">
        <dt>Alert category</dt><dd>${esc(r.acat || '—')}</dd>
        <dt>MITRE tactic</dt><dd style="text-transform:capitalize">${esc(r.mitre || '—')}</dd>
        <dt>Technique</dt><dd>${esc(r.tech.join(', ') || '—')}</dd>
        <dt>Orca score</dt><dd>${esc(r.orca || '—')}</dd>
        <dt>Priority</dt><dd>${esc(r.priority || '—')}</dd>
        <dt>ชื่อเดิม</dt><dd>${esc(r.rawDesc)}</dd>
      </dl></section>
      ${r.labels.length || r.tags.length ? `<section><h4>Labels / Tags</h4><div class="tags">${[...r.labels, ...r.tags].map(t => `<span>${esc(t)}</span>`).join('')}</div></section>` : ''}
    </div>`;
}

/* ---------- export ---------- */
function exportCSV() {
  const rows = filtered();
  const head = ['Control Id', 'Description', 'Category', 'Subcategory', 'Status', 'High', 'Medium', 'Low', 'Info', 'Failed Assets', 'Total Assets', 'Asset Compliance', 'Alert Category', 'MITRE', 'Access', 'Complexity', 'Impact', 'Recommendation'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const body = rows.map(r => [r.id, r.desc, r.cat, r.sub, r.status, r.al.h + r.al.c, r.al.m, r.al.l, r.al.i, r.failed, r.total, r.score ?? '', r.acat, r.mitre, r.access, r.cx, r.impact, r.rec].map(q).join(','));
  const blob = new Blob(['﻿' + [head.map(q).join(','), ...body].join('\r\n')], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `cspm_controls_${rows.length}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches('[data-pick]') || t.id === 'pickAll') return;
  if (t.closest('td.chk') || t.closest('th.chk')) {
    const inp = t.closest('td.chk,th.chk').querySelector('input');
    if (inp && t !== inp) inp.click();
    return;
  }
  const pb = t.closest('[data-pick-btn]');
  if (pb) { togglePick(pb.dataset.pickBtn); render(); writeHash(); return; }
  if (t.closest('#navPicked')) {
    S.view = 'controls'; S.f.picked = true; S.sel = null;
    render(); writeHash(); return;
  }
  if (t.closest('#btnPicked')) {
    S.f.picked = !S.f.picked;
    render(); writeHash(); return;
  }
  if (t.closest('#rmPickedFilter')) {
    S.f.picked = false;
    render(); writeHash(); return;
  }
  if (t.closest('#clearPicked')) {
    S.picked.clear(); S.f.picked = false; savePicked();
    render(); writeHash(); return;
  }
  if (t.closest('#shareBtn')) {
    writeHash();
    const u = new URL(location.href);
    if (S.shareKey) u.searchParams.set('k', S.shareKey);
    navigator.clipboard?.writeText(u.toString());
    const st = $('#shareTxt');
    if (st) { st.textContent = 'คัดลอกลิงก์แล้ว!'; setTimeout(() => st.textContent = 'แชร์ลิงก์', 1800); }
    return;
  }
  const g = t.closest('[data-go]');
  if (g) { go('controls', JSON.parse(g.dataset.go)); return; }
  const nav = t.closest('.nav[data-view]');
  if (nav) { S.view = nav.dataset.view; if (S.view === 'controls') S.f.picked = false; S.sel = null; render(); writeHash(); return; }
  const op = t.closest('[data-open]');
  if (op) { S.sel = op.dataset.open; S.tab = 'cli'; renderDrawer(); document.querySelectorAll('tr.on').forEach(x => x.classList.remove('on')); op.classList.add('on'); writeHash(); return; }
  if (t.closest('#dClose') || t === $('#scrim')) { S.sel = null; renderDrawer(); document.querySelectorAll('tr.on').forEach(x => x.classList.remove('on')); writeHash(); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; renderDrawer(); return; }
  const st = t.closest('[data-st]');
  if (st) { S.f.st = st.dataset.st; renderControls(); writeHash(); return; }
  const so = t.closest('[data-sort]');
  if (so) { const k = so.dataset.sort; S.sort = {k, d: S.sort.k === k ? -S.sort.d : (k === 'id' || k === 'desc' || k === 'mitre' || k === 'status' || k === 'score' ? 1 : -1)}; renderControls(); return; }
  const dd = t.closest('[data-ddbtn]');
  if (dd) { const k = dd.dataset.ddbtn; S.open === k ? closePop() : openPop(k); return; }
  const rm = t.closest('[data-rm]');
  if (rm) { S.f[rm.dataset.rm].delete(rm.dataset.v); renderControls(); writeHash(); return; }
  if (t.closest('#clearAll')) { go('controls', {}); return; }
  if (t.closest('#exportBtn')) { exportCSV(); return; }
  if (!t.closest('.pop')) closePop();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-pick]')) {
    togglePick(t.dataset.pick, t.checked);
    render(); writeHash();
  } else if (t.id === 'pickAll') {
    const rows = filtered();
    for (const r of rows) {
      if (t.checked) S.picked.add(r.id); else S.picked.delete(r.id);
    }
    if (!S.picked.size && S.f.picked) S.f.picked = false;
    savePicked(); render(); writeHash();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.open) closePop(); else if (S.sel) { S.sel = null; renderDrawer(); writeHash(); } }
  if (e.key === 'Enter' && e.target.matches('.kpi')) e.target.click();
  if (e.key === '/' && S.view === 'controls' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').focus(); }
});
let qt;
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  clearTimeout(qt); qt = setTimeout(() => { S.f.q = e.target.value.trim(); renderControls(); writeHash(); }, 150);
});
$('#fileSel').onchange = e => pick(+e.target.value);
$('#fileIn').onchange = e => e.target.files[0] && addFile(e.target.files[0]);
addEventListener('hashchange', () => { readHash(); if (S.rows.length) render(); });

// tooltip
const tip = $('#tip');
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (!el) { tip.classList.remove('on'); return; }
  tip.textContent = el.dataset.tip; tip.classList.add('on');
});
document.addEventListener('mousemove', e => {
  if (!tip.classList.contains('on')) return;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px';
  tip.style.top = (e.clientY + h + 24 > innerHeight ? e.clientY - h - 12 : e.clientY + 16) + 'px';
});

// drag & drop CSV
let dragN = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragN++; $('#drop').classList.add('on'); });
addEventListener('dragleave', () => { if (--dragN <= 0) { dragN = 0; $('#drop').classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#drop').classList.remove('on'); const f = e.dataTransfer.files[0]; if (f) addFile(f); });

// theme (default: light)
function applyTheme(t) {
  const theme = t === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  $('#themeBtn').innerHTML = ico(theme === 'dark' ? 'sun' : 'moon');
  $('#themeBtn').title = theme === 'dark' ? 'สลับเป็นธีมสว่าง' : 'สลับเป็นธีมมืด';
}
try { applyTheme(localStorage.getItem('cspm-theme') || 'light'); } catch (e) { applyTheme('light'); }
$('#themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('cspm-theme', next); } catch (e) {}
};

readHash();
boot();
</script>
</body>
</html>
